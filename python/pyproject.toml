[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eof-toolbox"
version = "2.0.0"
description = "Empirical Orthogonal Function (EOF / MEOF) analysis with spatial area weighting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Zelun Wu", email = "zelunwu@udel.edu"},
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
